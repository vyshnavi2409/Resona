services:
  - type: web
    name: resona
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      # These keys will be prompted for in the Render dashboard during deployment
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
